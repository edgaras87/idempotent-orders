# infrastructure/flyway/conf/flyway.conf
#
# Flyway is the only DDL path (constraint: internals/log.md 0006) and connects as
# the migrator identity — never as runtime, never as the bootstrap identity.
# Credentials are NOT here: the compose service passes FLYWAY_USER/FLYWAY_PASSWORD
# from ./.env. The url uses the compose network's service name.

flyway.url=jdbc:postgresql://postgres:5432/idempotent_orders
flyway.schemas=idempotent_orders
flyway.locations=filesystem:/flyway/sql